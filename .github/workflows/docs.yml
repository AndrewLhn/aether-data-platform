name: Documentation

on:
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            './**/*.md'
