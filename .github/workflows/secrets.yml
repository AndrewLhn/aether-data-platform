name: Secrets

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan history for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, so a shallow clone would only cover the
          # tip and miss anything introduced and later removed.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required for organizations; harmless for a personal repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The lock file pins artifacts by SHA-512 and the compose file pins images by
  # tag, so neither is covered by Dependabot. This job re-reads them and fails
  # if an artifact no longer matches its recorded digest, which is what a
  # compromised or silently re-released artifact would look like.
  artifacts:
    name: Verify pinned Flink library digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate libs.lock structure
        run: python3 scripts/check-flink-libs-lock.py

      - name: Re-download and verify every digest
        run: python3 scripts/check-flink-libs-lock.py --verify-downloads

      - name: Verify the JVM each artifact requires
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-java-requirement.py
