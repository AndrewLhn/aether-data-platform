name: ${COMPOSE_PROJECT_NAME:-aether}

# ---------------------------------------------------------------------------
# Shared Flink runtime configuration.
#
# FLINK_PROPERTIES is consumed by the official image entrypoint, which splits
# every line on the first ':' and runs envsubst over the value. That is how
# credentials reach Flink without being written into SQL or into the image.
#
# The S3 keys are duplicated deliberately:
#   s3.access-key / s3.secret-key            -> flink-s3-fs-hadoop plugin, used
#                                               for checkpoints and savepoints
#   s3.access-key-id / s3.secret-access-key  -> Iceberg S3FileIO, used for the
#                                               warehouse
# They are different configuration namespaces with different key names.
# ---------------------------------------------------------------------------
x-flink-environment: &flink-environment
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-2}
    parallelism.default: 1
    state.backend.type: rocksdb
    state.checkpoints.dir: s3://${S3_CHECKPOINT_BUCKET:-aether-flink}/checkpoints
    execution.checkpointing.savepoint-dir: s3://${S3_CHECKPOINT_BUCKET:-aether-flink}/savepoints
    execution.checkpointing.interval: ${CHECKPOINT_INTERVAL_SECONDS:-30}s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: 5s
    execution.checkpointing.timeout: 10min
    s3.endpoint: ${S3_ENDPOINT_INTERNAL:-http://seaweedfs:8333}
    s3.path.style.access: true
    s3.access-key: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
    s3.secret-key: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
  # Passed straight through to the Iceberg S3FileIO options rendered into the
  # pipeline SQL by services/streaming/docker/aether-entrypoint.sh.
  S3_ENDPOINT_INTERNAL: ${S3_ENDPOINT_INTERNAL:-http://seaweedfs:8333}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_WAREHOUSE_BUCKET: ${S3_WAREHOUSE_BUCKET:-aether-lakehouse}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:19092}

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DEBEZIUM_USER: ${DEBEZIUM_USER:?DEBEZIUM_USER must be set}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?DEBEZIUM_PASSWORD must be set}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - aether

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - aether

  connect:
    image: quay.io/debezium/connect:3.7
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:19092}
      GROUP_ID: aether-connect
      CONFIG_STORAGE_TOPIC: aether.connect.configs
      OFFSET_STORAGE_TOPIC: aether.connect.offsets
      STATUS_STORAGE_TOPIC: aether.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      OFFSET_FLUSH_INTERVAL_MS: 10000
      REST_HOST_NAME: 0.0.0.0
      REST_ADVERTISED_HOST_NAME: connect
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?DEBEZIUM_PASSWORD must be set}
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Probe the REST API rather than the TCP port: an open socket with a
      # failed worker would otherwise report healthy and break every dependent
      # wait condition.
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - aether

  # S3-compatible object store for the Iceberg warehouse and Flink checkpoints.
  # MinIO Community Edition was archived upstream on 2026-02-13 and its image
  # is no longer published, so the local stack uses SeaweedFS instead. Both
  # Flink and Iceberg only ever see an S3 endpoint, so the store stays swappable
  # through S3_ENDPOINT_INTERNAL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'cluster.status' | weed shell -master=localhost:9333 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    networks:
      - aether

  # Buckets are not created implicitly by the SeaweedFS S3 gateway, and Iceberg
  # will not create the warehouse bucket either. This one-shot container makes
  # the dependency explicit and idempotent so `up` is safe to re-run.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_WAREHOUSE_BUCKET: ${S3_WAREHOUSE_BUCKET:-aether-lakehouse}
      S3_CHECKPOINT_BUCKET: ${S3_CHECKPOINT_BUCKET:-aether-flink}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for bucket in "$$S3_WAREHOUSE_BUCKET" "$$S3_CHECKPOINT_BUCKET"; do
          until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw "$$bucket" \
             || echo "s3.bucket.create -name $$bucket" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q 'created bucket'; do
            echo "waiting to create bucket $$bucket..."
            sleep 2
          done
          echo "bucket $$bucket is ready"
        done
    restart: "no"
    networks:
      - aether

  flink-jobmanager:
    build:
      context: ../../services/streaming
      dockerfile: Dockerfile
    image: aether/flink:local
    entrypoint: ["/opt/flink/aether/aether-entrypoint.sh"]
    command: jobmanager
    environment:
      <<: *flink-environment
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    volumes:
      # Never mount over /opt/flink/lib: that would shadow the JARs shipped in
      # the base image. usrlib is the directory Flink adds to the user-code
      # classloader, which is where connector factories are discovered.
      - ./flink/lib:/opt/flink/usrlib:ro
      - ../../services/streaming/sql:/opt/flink/sql-src:ro
      - ../../services/streaming/docker:/opt/flink/aether:ro
    healthcheck:
      # Probe a REST route that returns 200. The web UI is served at '/', but
      # `wget --spider http://localhost:8081` against it exits 8 ("server issued
      # an error response"), which left a fully functional JobManager marked
      # unhealthy and blocked every service waiting on it. /overview is part of
      # the REST API and returns 200 as soon as the endpoint has leadership.
      # curl is present in the base image and reports HTTP status unambiguously.
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - aether

  flink-taskmanager:
    image: aether/flink:local
    # Reuses the image that flink-jobmanager builds. pull_policy keeps compose
    # from trying to fetch a locally built tag from Docker Hub when the image is
    # absent, which otherwise surfaces as a misleading "pull access denied"
    # printed alongside the real build error.
    pull_policy: never
    entrypoint: ["/opt/flink/aether/aether-entrypoint.sh"]
    command: taskmanager
    environment:
      <<: *flink-environment
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      # Never mount over /opt/flink/lib: that would shadow the JARs shipped in
      # the base image. usrlib is the directory Flink adds to the user-code
      # classloader, which is where connector factories are discovered.
      - ./flink/lib:/opt/flink/usrlib:ro
      - ../../services/streaming/sql:/opt/flink/sql-src:ro
      - ../../services/streaming/docker:/opt/flink/aether:ro
    healthcheck:
      # Ask the cluster whether this TaskManager actually registered, rather than
      # whether a TCP port happens to be open. A container that starts but fails
      # to reach the ResourceManager would otherwise report healthy.
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://flink-jobmanager:8081/taskmanagers | grep -q \"$HOSTNAME\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    networks:
      - aether

  # Submits the streaming job to the session cluster. Kept separate from the
  # JobManager so a failing job is visible as a failed one-shot container
  # instead of a crash-looping cluster, and so `make pipeline` can resubmit
  # without restarting Flink.
  pipeline-submit:
    image: aether/flink:local
    # Reuses the image that flink-jobmanager builds. pull_policy keeps compose
    # from trying to fetch a locally built tag from Docker Hub when the image is
    # absent, which otherwise surfaces as a misleading "pull access denied"
    # printed alongside the real build error.
    pull_policy: never
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    environment:
      <<: *flink-environment
    entrypoint: ["/opt/flink/aether/submit-pipeline.sh"]
    volumes:
      # Never mount over /opt/flink/lib: that would shadow the JARs shipped in
      # the base image. usrlib is the directory Flink adds to the user-code
      # classloader, which is where connector factories are discovered.
      - ./flink/lib:/opt/flink/usrlib:ro
      - ../../services/streaming/sql:/opt/flink/sql-src:ro
      - ../../services/streaming/docker:/opt/flink/aether:ro
    restart: "no"
    networks:
      - aether

networks:
  aether:
    name: ${COMPOSE_PROJECT_NAME:-aether}-network

volumes:
  postgres-data:
  kafka-data:
  seaweedfs-data:
