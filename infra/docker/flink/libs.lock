# Pinned Flink libraries for the Aether local stack.
#
# Format: <SHA-512>  <relative target path under infra/docker/flink>  <download URL>
#
# Every entry is verified before it is used, so a tampered or truncated
# download fails the build instead of silently producing a broken image.
#
# Hashes for the two Iceberg artifacts are the .sha512 files published by the
# Apache Iceberg release process on Maven Central. The Kafka connector hash was
# computed from the published artifact; flink-sql-connector-kafka is distributed
# without a .sha512 sidecar file.
#
# NOTE: JARs are deliberately NOT committed to git. Binary blobs in history are
# irreversible, bloat every clone, and cannot be reviewed or bumped by tooling.
# Run `make libs` (or scripts/download-flink-libs.sh) instead.
#
# Java baseline of the current set, measured from bytecode rather than taken
# from a release note: iceberg-flink-runtime-1.20 needs Java 17,
# iceberg-aws-bundle needs 11, flink-sql-connector-kafka needs 8. The base image
# in services/streaming/Dockerfile must therefore be a java17 variant or newer.
# `make verify-java` re-measures this and fails if the two drift apart.
# postgresql is the JDBC driver for the Iceberg catalog; it needs Java 8.
#
# Flink's own S3 filesystem plugin ships inside the image under /opt/flink/opt
# and is enabled by the image build, so it is not listed here. The RocksDB state
# backend is not there: as of Flink 1.20 it is bundled inside flink-dist and
# needs no plugin activation.

